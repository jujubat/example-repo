version: '3.8'

services:
  # Main Batuma GPRS Weather Application
  batuma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batuma-app
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      GUNICORN_BIND: "0.0.0.0:8000"
      GUNICORN_WORKERS: "4"
    volumes:
      - ./logs:/app/logs
      - ./batuma_gprs_weather:/app/batuma_gprs_weather:ro
    restart: unless-stopped
    networks:
      - batuma-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - firestore-emulator

  # Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: batuma-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - batuma-network
    depends_on:
      - batuma

  # Firestore Emulator (for local development)
  firestore-emulator:
    image: google/cloud-firestore-emulator:latest
    container_name: batuma-firestore
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
    restart: unless-stopped
    networks:
      - batuma-network
    command: ["start", "--host=0.0.0.0", "--port=8080"]

  # Monitoring with Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: batuma-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - batuma-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  # Grafana for Dashboards (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: batuma-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - batuma-network
    depends_on:
      - prometheus

networks:
  batuma-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
